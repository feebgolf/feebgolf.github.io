<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14532d">
  <title>Golf 🃏 feebgolf</title>
  <link rel="stylesheet" href="styles.css?v=3">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>">
</head>
<body>

  <!-- ===== Menu ===== -->
  <section id="screen-menu" class="screen">
    <div class="menu-box">
      <h1 class="title">Golf</h1>
      <p class="subtitle">the six-card game · 2–4 players</p>
      <label class="field">
        <span>Your name</span>
        <input id="name-input" type="text" maxlength="12" autocomplete="nickname" placeholder="e.g. Feeb">
      </label>
      <button id="btn-create" class="btn primary">Create game</button>
      <div class="divider"><span>or</span></div>
      <div class="join-row">
        <input id="code-input" type="text" maxlength="4" placeholder="CODE" autocapitalize="characters" autocomplete="off" spellcheck="false">
        <button id="btn-join" class="btn">Join</button>
      </div>
      <p id="menu-error" class="error" hidden></p>
      <p id="menu-status" class="muted" hidden></p>
    </div>
  </section>

  <!-- ===== Lobby ===== -->
  <section id="screen-lobby" class="screen" hidden>
    <div class="menu-box">
      <p class="subtitle">room code</p>
      <div id="lobby-code" class="room-code">····</div>
      <button id="btn-copy" class="btn small">Copy invite link</button>
      <ul id="lobby-players" class="player-list"></ul>
      <button id="btn-start" class="btn primary" hidden>Start game</button>
      <p id="lobby-status" class="muted"></p>
      <button id="btn-leave" class="btn small ghost">Leave</button>
    </div>
  </section>

  <!-- ===== Game table ===== -->
  <section id="screen-game" class="screen table" hidden>
    <div id="live-scores">
      <div class="ls-title">this round</div>
    </div>
    <div id="opponents"></div>
    <div id="table-center">
      <div class="piles">
        <div id="deck-pile" class="pile">
          <div class="card back deck-card"><span id="deck-count" class="deck-count"></span></div>
          <span class="pile-label">deck</span>
        </div>
        <div id="discard-pile" class="pile">
          <div id="discard-card"></div>
          <span class="pile-label">discard</span>
        </div>
        <div id="drawn-slot" class="pile" hidden>
          <div id="drawn-card"></div>
          <span class="pile-label">drawn</span>
        </div>
      </div>
      <div id="drawn-actions" hidden>
        <button id="btn-swap-drawn" class="btn small">Swap into grid</button>
        <button id="btn-discard-flip" class="btn small">Discard &amp; flip</button>
        <button id="btn-cancel-mode" class="btn small ghost" hidden>Cancel</button>
      </div>
      <div id="log"></div>
    </div>
    <div id="my-area">
      <div id="my-header"></div>
      <div id="my-grid" class="grid mine"></div>
      <div id="status-bar"></div>
    </div>
    <div id="banner" hidden></div>
  </section>

  <!-- ===== Round end overlay ===== -->
  <div id="overlay-roundend" class="overlay" hidden>
    <div class="overlay-box">
      <h2 id="roundend-title"></h2>
      <div id="roundend-winner"></div>
      <div id="roundend-hands"></div>
      <table id="scoreboard"></table>
      <div class="overlay-buttons">
        <button id="btn-next-round" class="btn primary" hidden>Next round</button>
        <button id="btn-to-lobby" class="btn ghost" hidden>Back to lobby</button>
        <p id="roundend-wait" class="muted" hidden>Waiting for the host…</p>
      </div>
    </div>
  </div>

  <div id="toast" hidden></div>

  <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <script type="module" src="js/main.js?v=3"></script>
</body>
</html>
